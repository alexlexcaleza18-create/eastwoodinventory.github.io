```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROJECT ONE STUDIOS INVENTORY (EASTWOOD)</title>


<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    background-image: url("lorealparis.png");
}

.container {
    max-width: 1400px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
}

.form {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

input, select, button {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
}

button {
    cursor: pointer;
    border: none;
    color: white;
    font-weight: bold;
}

.add-btn {
    background: #28a745;
}

.edit {
    background: #ffc107;
    color: black;
}

.delete {
    background: #dc3545;
}

.search {
    width: 100%;
    margin-bottom: 15px;
    box-sizing: border-box;
}

.summary {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    flex: 1;
    padding: 15px;
    background: #f1f3f5;
    border-radius: 8px;
    text-align: center;
}

.card h2 {
    margin: 5px 0;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #343a40;
    color: white;
}

tr:nth-child(even) {
    background: #f8f9fa;
}

.equipment-image {
    width: 100px;
    height: 80px;
    object-fit: contain;
    border-radius: 5px;
    cursor: pointer;
}

.no-image {
    color: #999;
    font-size: 12px;
}

@media (max-width: 800px) {
    .form {
        grid-template-columns: 1fr;
    }

    .summary {
        flex-direction: column;
    }

    table {
        font-size: 12px;
    }
}
</style>

</head>

<body>

<div class="container">

<h1>Project One Studios (EASTWOOD)</h1>
<h1 style="text-align: center;">IT Asset Inventory</h1>

<div class="summary">

<div class="card">
<div>Total Items</div>
<h2 id="totalItems">0</h2>
</div>

<div class="card">
<div>Total Quantity</div>
<h2 id="totalQuantity">0</h2>
</div>

<div class="card">
<div>Working</div>
<h2 id="workingItems">0</h2>
</div>

</div>

<input
type="text"
id="search"
class="search"
placeholder="Search equipment, brand, room, status..."
onkeyup="displayInventory()"
>

<div class="form">

<input
type="text"
id="item"
placeholder="Equipment Name"
>

<input
type="text"
id="brand"
placeholder="Brand"
>

<input
type="text"
id="room"
placeholder="Room / Location"
>

<input
type="number"
id="quantity"
placeholder="Quantity"
min="1"
>

<select id="status">

<option value="Working">Working</option>
<option value="Defective">Defective</option>
<option value="For Repair">For Repair</option>
<option value="Spare">Spare</option>
<option value="Replaced">Replaced</option>

</select>

<input
type="text"
id="remarks"
placeholder="Remarks"
>

<!-- EQUIPMENT PICTURE -->

<input
type="file"
id="picture"
accept="image/*"
>

</div>

<button class="add-btn" onclick="addItem()">
+ Add Inventory
</button>

<br><br>

<table>

<thead>

<tr>

<th>#</th>

<th>Picture</th>

<th>Equipment</th>

<th>Brand</th>

<th>Room / Location</th>

<th>Quantity</th>

<th>Status</th>

<th>Remarks / Asset Tag</th>

<th>Action</th>

</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>


<script>

let inventory =
JSON.parse(localStorage.getItem("inventory")) || [];

let editIndex = -1;


// ADD ITEM

function addItem() {

let item =
document.getElementById("item").value.trim();

let brand =
document.getElementById("brand").value.trim();

let room =
document.getElementById("room").value.trim();

let quantity =
document.getElementById("quantity").value;

let status =
document.getElementById("status").value;

let remarks =
document.getElementById("remarks").value.trim();

let pictureFile =
document.getElementById("picture").files[0];


if (!item || !quantity) {

alert("Please enter equipment name and quantity.");

return;

}


// If picture was selected

if (pictureFile) {

let reader = new FileReader();

reader.onload = function(e) {

saveItem(
item,
brand,
room,
quantity,
status,
remarks,
e.target.result
);

};

reader.readAsDataURL(pictureFile);

} else {


// If editing and no new picture,
// keep the old picture

let oldPicture = "";

if (editIndex !== -1) {

oldPicture = inventory[editIndex].picture || "";

}

saveItem(
item,
brand,
room,
quantity,
status,
remarks,
oldPicture
);

}

}


// SAVE ITEM

function saveItem(
item,
brand,
room,
quantity,
status,
remarks,
picture
) {

let newItem = {

item: item,

brand: brand,

room: room,

quantity: Number(quantity),

status: status,

remarks: remarks,

picture: picture

};


if (editIndex === -1) {

inventory.push(newItem);

} else {

inventory[editIndex] = newItem;

editIndex = -1;

}


saveData();

clearForm();

displayInventory();

}


// DISPLAY INVENTORY

function displayInventory() {

let table =
document.getElementById("inventoryTable");

let search =
document
.getElementById("search")
.value
.toLowerCase();

table.innerHTML = "";


inventory.forEach((data, index) => {

let searchableText =

data.item + " " +

data.brand + " " +

data.room + " " +

data.status + " " +

data.remarks;


if (!searchableText
.toLowerCase()
.includes(search)) {

return;

}


let row = table.insertRow();


let imageHTML = "";

if (data.picture) {

imageHTML = `

<img

src="${data.picture}"

class="equipment-image"

onclick="viewImage('${data.picture}')"

title="Click to view larger image"

>

`;

} else {

imageHTML = `

<span class="no-image">
No Picture
</span>

`;

}


row.innerHTML = `

<td>${index + 1}</td>

<td>
${imageHTML}
</td>

<td>${data.item}</td>

<td>${data.brand}</td>

<td>${data.room}</td>

<td>${data.quantity}</td>

<td>${data.status}</td>

<td>${data.remarks}</td>

<td>

<button
class="edit"
onclick="editItem(${index})"
>
Edit
</button>

<button
class="delete"
onclick="deleteItem(${index})"
>
Delete
</button>

</td>

`;

});


updateSummary();

}


// VIEW LARGE IMAGE

function viewImage(image) {

let newWindow =
window.open("", "_blank");

newWindow.document.write(`

<html>

<head>

<title>Equipment Picture</title>

<style>

body {

margin:0;

background:#111;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

img {

max-width:95%;

max-height:95%;

object-fit:contain;

}

</style>

</head>

<body>

<img src="${image}">

</body>

</html>

`);

}


// EDIT ITEM

function editItem(index) {

let data = inventory[index];


document.getElementById("item").value =
data.item;

document.getElementById("brand").value =
data.brand;

document.getElementById("room").value =
data.room;

document.getElementById("quantity").value =
data.quantity;

document.getElementById("status").value =
data.status;

document.getElementById("remarks").value =
data.remarks;


// Clear picture selection

document.getElementById("picture").value = "";


editIndex = index;


window.scrollTo({

top: 0,

behavior: "smooth"

});

}


// DELETE ITEM

function deleteItem(index) {

if (
confirm(
"Are you sure you want to delete this item?"
)
) {

inventory.splice(index, 1);

saveData();

displayInventory();

}

}


// CLEAR FORM

function clearForm() {

document.getElementById("item").value = "";

document.getElementById("brand").value = "";

document.getElementById("room").value = "";

document.getElementById("quantity").value = "";

document.getElementById("status").value =
"Working";

document.getElementById("remarks").value = "";

document.getElementById("picture").value = "";

editIndex = -1;

}


// SAVE DATA

function saveData() {

localStorage.setItem(
"inventory",
JSON.stringify(inventory)
);

}


// SUMMARY

function updateSummary() {

let totalQuantity = 0;

let working = 0;


inventory.forEach(data => {

totalQuantity +=
Number(data.quantity);


if (data.status === "Working") {

working +=
Number(data.quantity);

}

});


document.getElementById("totalItems")
.innerText =
inventory.length;


document.getElementById("totalQuantity")
.innerText =
totalQuantity;


document.getElementById("workingItems")
.innerText =
working;

}


// INITIAL DISPLAY

displayInventory();

</script>

</body>
</html>
```
